name: Backend

# Tests and deploys the print-order Worker (backend/) to Cloudflare.
#
# Repository secrets used:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   (required to deploy)
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, PRODIGI_API_KEY
#                                                 (optional; copied into the Worker when present)
# ASSET_SIGNING_KEY is generated once inside Cloudflare if the Worker doesn't have it.

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check the Cloudflare secrets
        working-directory: .
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Trim spaces and line breaks that sneak in when pasting.
          trim() { local v="${1//$'\r'/}"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          token="$(trim "$RAW_TOKEN")"
          account="$(trim "$RAW_ACCOUNT")"
          if [ -z "$token" ] || [[ "$token" =~ [[:space:]] ]]; then
            echo "::error::The CLOUDFLARE_API_TOKEN secret is empty or has more than the token in it (a line break or extra text). Create a new token in Cloudflare and paste only the token itself into the GitHub secret."
            exit 1
          fi
          if ! [[ "$account" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::The CLOUDFLARE_ACCOUNT_ID secret doesn't look like an account ID (32 letters and numbers, from the Workers & Pages overview page)."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Copy service keys into the Worker
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PRODIGI_API_KEY: ${{ secrets.PRODIGI_API_KEY }}
        run: |
          for name in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET PRODIGI_API_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            else
              echo "::notice::$name is not set in GitHub secrets yet; skipping."
            fi
          done
          if ! npx wrangler secret list | grep -q '"ASSET_SIGNING_KEY"'; then
            openssl rand -hex 32 | tr -d '\n' | npx wrangler secret put ASSET_SIGNING_KEY
          fi

      - name: Delete poster files 30 days after upload
        continue-on-error: true
        run: npx wrangler r2 bucket lifecycle add year-barcode-prints delete-old-prints prints/ --expire-days 30 --force

      - name: Show the Worker URL
        run: npx wrangler deployments list | head -20
