name: Backend

# Tests and deploys the print-order Worker (backend/) to Cloudflare.
#
# Repository secrets used:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   (required to deploy)
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, PRODIGI_API_KEY
#                                                 (optional; copied into the Worker when present)
# ASSET_SIGNING_KEY is generated once inside Cloudflare if the Worker doesn't have it.

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check the Cloudflare secrets
        working-directory: .
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Trim spaces and line breaks that sneak in when pasting.
          trim() { local v="${1//$'\r'/}"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          token="$(trim "$RAW_TOKEN")"
          account="$(trim "$RAW_ACCOUNT")"
          if [ -z "$token" ] || [[ "$token" =~ [[:space:]] ]]; then
            echo "::error::The CLOUDFLARE_API_TOKEN secret is empty or has more than the token in it (a line break or extra text). Create a new token in Cloudflare and paste only the token itself into the GitHub secret."
            exit 1
          fi
          # Name the usual mix-ups without printing the value.
          if [ "$token" = "$account" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN holds the account ID. Put the API token there (the long value Cloudflare shows once after you create or roll a token)."
            exit 1
          fi
          if [[ "$token" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN looks like a Token ID (32 hex characters from the token list), not the token itself. In Cloudflare, open API Tokens, click ... next to the token, Roll, and copy the value shown in the box."
            exit 1
          fi
          if [[ "$token" =~ ^[0-9a-f]{37}$ ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN looks like the Global API Key. Use an API token instead (API Tokens, Create Token, Edit Cloudflare Workers template)."
            exit 1
          fi
          if ! [[ "$token" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN has characters a token never contains (quotes, punctuation or letters from a different keyboard). Copy it again with the copy button and paste only the value."
            exit 1
          fi
          echo "Token: ${#token} characters, letters/numbers/-/_ only."
          if ! [[ "$account" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::The CLOUDFLARE_ACCOUNT_ID secret doesn't look like an account ID (32 letters and numbers, from the Workers & Pages overview page)."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Check Prodigi products and costs
        env:
          PRODIGI_API_KEY: ${{ secrets.PRODIGI_API_KEY }}
        run: npx tsx scripts/check-prodigi.ts

      - name: Create the poster storage bucket (first deploy only)
        run: |
          if npx wrangler r2 bucket list 2>&1 | grep -q "year-barcode-prints"; then
            echo "Bucket year-barcode-prints exists."
          elif ! out=$(npx wrangler r2 bucket create year-barcode-prints 2>&1); then
            echo "$out"
            echo "::error::Couldn't create the R2 bucket. In Cloudflare, open R2 Object Storage and turn it on (it asks you to accept the R2 plan; the free tier covers this app), and make sure the API token has Account → Workers R2 Storage → Edit. Then run this workflow again."
            exit 1
          else
            echo "Created bucket year-barcode-prints."
          fi

      - name: Deploy Worker
        # A brand-new Worker can briefly read as missing right after its first
        # upload; one retry covers that.
        run: npx wrangler deploy || { echo "Retrying in 15 seconds..."; sleep 15; npx wrangler deploy; }

      - name: Copy service keys into the Worker
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PRODIGI_API_KEY: ${{ secrets.PRODIGI_API_KEY }}
        run: |
          for name in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET PRODIGI_API_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            else
              echo "::notice::$name is not set in GitHub secrets yet; skipping."
            fi
          done
          if ! npx wrangler secret list | grep -q '"ASSET_SIGNING_KEY"'; then
            openssl rand -hex 32 | tr -d '\n' | npx wrangler secret put ASSET_SIGNING_KEY
          fi

      - name: Delete poster files 30 days after upload
        continue-on-error: true
        run: |
          if npx wrangler r2 bucket lifecycle list year-barcode-prints 2>&1 | grep -q "delete-old-prints"; then
            echo "Rule delete-old-prints is already set."
          else
            npx wrangler r2 bucket lifecycle add year-barcode-prints delete-old-prints prints/ --expire-days 30 --force
          fi

      - name: Show the Worker URL
        run: npx wrangler deployments list | head -20
