name: TestFlight

# Builds the app on a GitHub-hosted Mac and uploads it to App Store Connect.
# Run it from the Actions tab ("Run workflow"). No Mac needed.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID                 10-character Team ID from developer.apple.com → Membership
#   APP_STORE_CONNECT_KEY_ID      Key ID of an App Store Connect API key (Admin role)
#   APP_STORE_CONNECT_ISSUER_ID   Issuer ID shown above the API keys list
#   APP_STORE_CONNECT_KEY         Full contents of the downloaded AuthKey_XXXX.p8 file
# Optional repository variable:
#   BUNDLE_ID                     Defaults to com.yearbarcode.app

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.yearbarcode.app' }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=0
          for name in TEAM_ID KEY_ID ISSUER_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret for $name"; missing=1; fi
          done
          if [ -z "${{ secrets.APP_STORE_CONNECT_KEY }}" ]; then echo "::error::Missing secret APP_STORE_CONNECT_KEY"; missing=1; fi
          exit $missing

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Write API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "${{ secrets.APP_STORE_CONNECT_KEY }}" > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Generate project
        run: |
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER: com.yearbarcode.app/PRODUCT_BUNDLE_IDENTIFIER: $BUNDLE_ID/" project.yml
          brew install xcodegen
          xcodegen generate

      - name: Archive
        run: |
          xcodebuild -project YearBarcode.xcodeproj -scheme YearBarcode -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/YearBarcode.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Sign with cloud-managed certificate and upload
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/YearBarcode.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
