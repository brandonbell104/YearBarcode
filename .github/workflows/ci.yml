name: CI

on:
  push:
  pull_request:

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y zlib1g-dev
      - run: swift test
        working-directory: Packages/YearBarcodeCore

  ios:
    name: Core tests + iOS app build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Core tests
        run: swift test
        working-directory: Packages/YearBarcodeCore
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build app for simulator
        run: |
          xcodebuild -project YearBarcode.xcodeproj -scheme YearBarcode \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
