# Generate the Xcode project with XcodeGen: `xcodegen generate`
name: YearBarcode
options:
  bundleIdPrefix: com.yearbarcode
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  YearBarcodeCore:
    path: Packages/YearBarcodeCore
  Stripe:
    url: https://github.com/stripe/stripe-ios-spm
    from: 24.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  YearBarcode:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
    dependencies:
      - package: YearBarcodeCore
      - package: Stripe
        product: StripePaymentSheet
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yearbarcode.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        # Stripe test/live publishable key; the TestFlight workflow passes it in.
        STRIPE_PUBLISHABLE_KEY: ""
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Year Barcode
        # Read from build settings so the TestFlight workflow can raise the build number each run.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        StripePublishableKey: $(STRIPE_PUBLISHABLE_KEY)
        # Return address for payment methods that leave the app (banks, wallets).
        CFBundleURLTypes:
          - CFBundleURLName: com.yearbarcode.app.stripe
            CFBundleURLSchemes:
              - yearbarcode
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: >-
          Year Barcode reads your photos on this iPhone to calculate their average colors.
          Your photo library is not uploaded.
        NSPhotoLibraryAddUsageDescription: >-
          Year Barcode saves your finished poster PNG to your photo library when you tap Save to Photos.
        # Continued-processing tasks are submitted with a unique suffix per run.
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).generation.*
        UIBackgroundModes:
          - processing

schemes:
  YearBarcode:
    build:
      targets:
        YearBarcode: all
    run:
      config: Debug
      storeKitConfiguration: App/StoreKit/Products.storekit
